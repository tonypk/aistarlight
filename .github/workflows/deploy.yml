name: Deploy Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc -b --noEmit

      - name: Build
        run: npx vite build

  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to GCE via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_KEY }}
          script: |
            set -euo pipefail
            FRONTEND_DIR=/home/anna/aistarlight
            COMPOSE_DIR=/home/anna/aistarlight-go
            COMPOSE="sudo docker compose -p aistarlight -f docker-compose.prod.yml"

            # Pull latest frontend code
            cd "$FRONTEND_DIR"
            sudo -u anna git pull origin main

            # Rebuild and restart frontend container
            cd "$COMPOSE_DIR"
            $COMPOSE build --no-cache frontend
            $COMPOSE up -d frontend

            # Reload nginx to pick up new container IP
            $COMPOSE exec -T nginx nginx -s reload 2>/dev/null || true

            echo "Frontend deploy complete: $(date)"
